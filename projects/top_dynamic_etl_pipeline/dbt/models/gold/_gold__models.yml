version: 2

models:
  - name: gold_noaa_isd_station_daily
    description: >
      One row per station per day -- observation count and daily
      temperature/wind/pressure aggregates, built only from observations
      SILVER flagged as physically plausible.
    columns:
      - name: station_id
        tests:
          - not_null
      - name: observation_date
        tests:
          - not_null
      - name: observation_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
